<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlokShots Virtual Tours</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2em;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
    }
    .logo {
      width: auto;
      height: auto;
      margin-bottom: 1em;
    }
    .tour-list {
      list-style: none;
      padding: 0;
    }
    .tour-list li {
      margin: 1em 0;
    }
    .tour-list a {
      text-decoration: none;
      color: #0066cc;
      display: flex;
      align-items: center;
    }
    .tour-list a:hover {
      color: #003366;
    }
    .tour-list img {
      width: 100px;
      height: auto;
      margin-right: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <img src="assets/fulllogo_transparent.png" alt="BlokShots Logo" class="logo" />
  <h1>Welcome to BlokShots Virtual Tours</h1>
  <p>Select a property tour below:</p>
  <ul class="tour-list">
    <li>
      <a href="https://blokshots.github.io/7005-Madison-Merrillville-Indiana-46410/">
        <img src="https://blokshots.github.io/assets/7005-Madison-St.jpg" alt="7005 Madison Tour Thumbnail" />
        7005 Madison - Merrillville, IN
      </a>
    </li>
  </ul>
</body>
</html>
